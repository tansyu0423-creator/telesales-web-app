[project]
name = "telesales-scoring"
version = "0.1.0"
description = "Telesales Lead Scoring System"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "minio>=7.2.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "groq>=1.6.0",
    "pyannote-audio>=4.0.7",
    "google-genai>=0.1.0",
    "celery>=5.6.3",
    "redis>=8.1.0",
]

[tool.pyright]
venvPath = "/home/SHUNTAF/Desktop/telesales_scoring"
venv = ".venv"
extraPaths = [
    "/home/SHUNTAF/Desktop/telesales_scoring/backend"
]

[tool.pyrefly]
python-interpreter-path = "/home/SHUNTAF/Desktop/telesales_scoring/.venv/bin/python"
search-path = [
    "/home/SHUNTAF/Desktop/telesales_scoring/backend"
]

[tool.uv]
override-dependencies = []

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
]
